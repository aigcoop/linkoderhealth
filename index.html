<!DOCTYPE html>

  <style>
    :root {

      --brand:#4f46e5; --brand2:#6366f1; --green:#10b981; --rose:#f43f5e; --amber:#f59e0b;

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",Arial,sans-serif; background:var(--bg); color:var(--ink); -webkit-tap-highlight-color:transparent; }

    .topbar { position:sticky; top:0; z-index:50; background:rgba(255,255,255,.92); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); box-shadow:0 4px 18px rgba(15,23,42,.05); }

    .pill-btn { display:inline-flex; align-items:center; justify-content:center; gap:5px; border-radius:999px; padding:8px 11px; font-size:11px; font-weight:900; text-decoration:none; white-space:nowrap; transition:.18s ease; }
    .pill-green { background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; }
    .pill-indigo { background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; }

    .search-box input { width:100%; border:1px solid var(--line); background:#fff; border-radius:18px; padding:13px 44px; outline:none; font-size:14px; font-weight:700; box-shadow:0 4px 14px rgba(15,23,42,.04); }

    .clear-btn { position:absolute; right:10px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:999px; background:#f1f5f9; color:#64748b; display:none; }
    .clear-btn.show { display:grid; place-items:center; }
    .catbar { border-top:1px solid #f1f5f9; overflow-x:auto; white-space:nowrap; scrollbar-width:none; padding:10px 16px 12px; max-width:1180px; margin:0 auto; }
    .catbar::-webkit-scrollbar { display:none; }
    .cat-btn { display:inline-flex; margin-right:7px; border-radius:999px; padding:8px 13px; background:#fff; border:1px solid var(--line); color:#475569; font-size:12px; font-weight:900; box-shadow:0 3px 10px rgba(15,23,42,.03); }
    .cat-btn.active { background:var(--brand); color:#fff; border-color:var(--brand); box-shadow:0 8px 18px rgba(79,70,229,.22); }
    .container { max-width:1180px; margin:0 auto; padding:22px 12px 80px; }
    .summary-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 4px 14px; }
    .count { color:var(--muted); font-size:12px; font-weight:900; }
    .sort-select { border:1px solid var(--line); background:#fff; padding:8px 10px; border-radius:12px; color:#475569; font-size:12px; font-weight:800; outline:none; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }

    @media (min-width:980px) { .grid { grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; } }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 4px 14px rgba(15,23,42,.04); transition:.18s ease; position:relative; }

    .thumb img { width:100%; height:100%; object-fit:cover; display:block; transition:.25s ease; }
    .card:hover .thumb img { transform:scale(1.035); }
    .img-fallback { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:10px; color:#94a3b8; background:linear-gradient(135deg,#f8fafc,#e2e8f0); font-size:11px; font-weight:900; }
    .card-body { padding:9px 8px 10px; min-height:66px; text-align:center; }
    .cat-label { color:var(--brand); font-size:9px; font-weight:900; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-title { margin:0; font-size:11px; line-height:1.3; font-weight:900; letter-spacing:-.04em; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .download-mini { position:absolute; right:6px; top:6px; z-index:2; width:30px; height:30px; border-radius:11px; color:#fff; background:rgba(79,70,229,.92); display:grid; place-items:center; box-shadow:0 8px 18px rgba(15,23,42,.2); opacity:0; transition:.18s ease; }

    .empty { padding:80px 20px; text-align:center; color:#94a3b8; font-weight:900; }
    .modal-backdrop { position:fixed; inset:0; z-index:100; background:rgba(2,6,23,.66); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; padding:14px; }

    .modal-cat { display:inline-flex; background:#eef2ff; color:#4338ca; border:1px solid #c7d2fe; border-radius:999px; padding:4px 9px; font-size:10px; font-weight:900; margin-bottom:8px; }
    .modal h2 { margin:0 0 14px; font-size:20px; line-height:1.25; letter-spacing:-.045em; }

    .tab.active { color:var(--brand); border-bottom-color:var(--brand); }
    .modal-body { flex:1; overflow:auto; background:#fbfdff; padding:20px; }

    .small-btn { flex:1; min-width:90px; display:inline-flex; align-items:center; justify-content:center; gap:5px; border-radius:14px; padding:10px 12px; background:#fff; color:#475569; border:1px solid var(--line); font-size:11px; font-weight:900; transition:.14s ease; }

    const CATEGORY_ORDER = ["전체보기", "케어세르브 웨이브 플러스", "영양건강", "텔로메라GK,정", "디엘릭서", "의료기기", "기타"];
    const SHOP_URL = "https://vcshop.gcoop.com/kr";
    const FALLBACK_URL = "https://vcshop.gcoop.com/kr/display?cate=7&itemNo=3189";

    const state = {
      category: "전체보기",
      query: "",
      sort: "default",
      selected: null,
      tab: "images",
      editingCustomId: null,
      customLinks: [],
      personalLinks: {}
    };

    const $ = (id) => document.getElementById(id);
    const el = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined && text !== null) node.textContent = text;
      return node;
    };

    function safeUrl(url) {
      const value = String(url || "").trim();
      if (!value) return "";
      if (/^(https?:|mailto:|tel:)/i.test(value)) return value;
      return "https://" + value;
    }

    function saveStorage() {
      localStorage.setItem("gcoop_promptbook_personalLinks", JSON.stringify(state.personalLinks));
      localStorage.setItem("gcoop_promptbook_customLinks", JSON.stringify(state.customLinks));
    }

    function loadStorage() {
      try { state.personalLinks = JSON.parse(localStorage.getItem("gcoop_promptbook_personalLinks") || "{}"); } catch(e) { state.personalLinks = {}; }
      try { state.customLinks = JSON.parse(localStorage.getItem("gcoop_promptbook_customLinks") || "[]"); } catch(e) { state.customLinks = []; }
    }

    function toast(message) {
      $("toastMsg").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => $("toast").classList.remove("show"), 2300);
    }

    async function copyText(text, label="내용") {
      const value = String(text || "");
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.style.position = "fixed";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          document.execCommand("copy");
          textarea.remove();
        }
        toast(label + " 복사 완료");
      } catch(e) {
        toast("복사에 실패했습니다. 주소를 직접 선택해 주세요.");
      }
    }

    async function shareLink(title, url) {
      const clean = safeUrl(url);
      if (!clean) { toast("공유할 주소가 없습니다."); return; }
      if (navigator.share) {
        try { await navigator.share({ title: title || "공유 링크", url: clean }); } catch(e) { /* 사용자가 취소한 경우 무시 */ }
      } else {
        copyText(clean, "주소");
      }
    }

    function makeImage(src, alt, onClick) {
      const wrap = el("div", "thumb");
      const img = document.createElement("img");
      img.src = src || "";
      img.alt = alt || "이미지";
      img.loading = "lazy";
      img.decoding = "async";
      img.onerror = () => {
        img.remove();
        if (!wrap.querySelector(".img-fallback")) wrap.appendChild(el("div", "img-fallback", "이미지 없음\n" + (src || "")));
      };
      if (onClick) wrap.addEventListener("click", onClick);
      wrap.appendChild(img);
      return wrap;
    }

    function downloadImage(url, filename) {
      if (!url) { toast("저장할 이미지가 없습니다."); return; }
      const a = document.createElement("a");
      a.href = url;
      a.download = filename || url.split("/").pop() || "image.jpg";
      document.body.appendChild(a);
      a.click();
      a.remove();
      toast("이미지 저장을 시작합니다.");
    }

    function downloadAll(product) {
      if (!product || !product.images || !product.images.length) { toast("저장할 이미지가 없습니다."); return; }
      product.images.forEach((src, idx) => {
        setTimeout(() => downloadImage(src, `${product.title}_${idx + 1}.jpg`), idx * 220);
      });
    }

    function productText(product) {
      return [
        product.title, product.category, product.content, product.ingredients, product.usage,
        ...(product.points || []), ...(product.recommend || [])
      ].join(" ").toLowerCase();
    }

    function filteredProducts() {
      const q = state.query.trim().toLowerCase();
      let list = PRODUCTS.filter((p) => {
        const okCat = state.category === "전체보기" || p.category === state.category;
        const okQ = !q || productText(p).includes(q);
        return okCat && okQ;
      });
      if (state.sort === "title") list = list.slice().sort((a,b) => a.title.localeCompare(b.title, "ko"));
      if (state.sort === "category") list = list.slice().sort((a,b) => (a.category + a.title).localeCompare(b.category + b.title, "ko"));
      return list;
    }

    function renderCategories() {
      const bar = $("categoryBar");
      bar.innerHTML = "";
      const categories = CATEGORY_ORDER.filter((cat) => cat === "전체보기" || cat === "기타" || PRODUCTS.some((p) => p.category === cat));
      const extras = [...new Set(PRODUCTS.map((p) => p.category))].filter((cat) => !categories.includes(cat));
      [...categories, ...extras].forEach((cat) => {
        const btn = el("button", "cat-btn" + (state.category === cat ? " active" : ""), cat);
        btn.type = "button";
        btn.addEventListener("click", () => {
          state.category = cat;
          render();
        });
        bar.appendChild(btn);
      });
    }

    function renderProducts() {
      const grid = $("productGrid");
      const empty = $("emptyProducts");
      const list = filteredProducts();
      grid.innerHTML = "";
      $("resultCount").textContent = `${state.category} · ${list.length}개`;
      empty.classList.toggle("hidden", list.length !== 0);

      list.forEach((product) => {
        const card = el("article", "card");
        const dl = el("button", "download-mini", "↓");
        dl.type = "button";
        dl.title = "이미지 전체 저장";
        dl.addEventListener("click", (ev) => { ev.stopPropagation(); downloadAll(product); });
        card.appendChild(dl);
        card.appendChild(makeImage((product.images || [])[0], product.title));
        const body = el("div", "card-body");
        body.appendChild(el("div", "cat-label", product.category));
        body.appendChild(el("h3", "card-title", product.title));
        card.appendChild(body);
        card.addEventListener("click", () => openModal(product));
        grid.appendChild(card);
      });
    }

    function renderCustomLinks() {
      const list = $("customList");
      list.innerHTML = "";
      $("emptyCustom").classList.toggle("hidden", state.customLinks.length !== 0);
      state.customLinks.forEach((link) => {
        const item = el("div", "custom-item");
        item.appendChild(el("h3", "", link.name || "제목 없음"));
        item.appendChild(el("p", "", link.url || ""));
        const row = el("div", "btn-row");
        const open = el("a", "small-btn green", "열기");
        open.href = safeUrl(link.url); open.target = "_blank"; open.rel = "noopener";
        const edit = el("button", "small-btn", "수정"); edit.type="button";
        edit.addEventListener("click", () => editCustom(link.id));
        const copy = el("button", "small-btn", "복사"); copy.type="button";
        copy.addEventListener("click", () => copyText(link.url, "주소"));
        const share = el("button", "small-btn", "공유"); share.type="button";
        share.addEventListener("click", () => shareLink(link.name, link.url));
        const del = el("button", "small-btn rose", "삭제"); del.type="button";
        del.addEventListener("click", () => {
          state.customLinks = state.customLinks.filter((x) => x.id !== link.id);
          saveStorage(); renderCustomLinks(); toast("링크가 삭제되었습니다.");
        });
        [open, edit, copy, share, del].forEach((node) => row.appendChild(node));
        item.appendChild(row);
        list.appendChild(item);
      });
    }

    function saveCustom() {
      const name = $("customName").value.trim() || "제목 없음";
      const url = $("customUrl").value.trim();
      if (!url) { toast("주소를 입력해 주세요."); return; }
      if (state.editingCustomId) {
        state.customLinks = state.customLinks.map((link) => link.id === state.editingCustomId ? { ...link, name, url } : link);
        state.editingCustomId = null;
        $("saveCustom").textContent = "＋ 나만의 주소 등록하기";
        $("cancelEdit").classList.add("hidden");
        toast("링크가 수정되었습니다.");
      } else {
        state.customLinks.unshift({ id:String(Date.now()), name, url, createdAt:Date.now() });
        toast("새 링크가 등록되었습니다.");
      }
      $("customName").value = ""; $("customUrl").value = "";
      saveStorage(); renderCustomLinks();
    }

    function editCustom(id) {
      const link = state.customLinks.find((x) => x.id === id);
      if (!link) return;
      state.editingCustomId = id;
      $("customName").value = link.name || "";
      $("customUrl").value = link.url || "";
      $("saveCustom").textContent = "✓ 수정 완료";
      $("cancelEdit").classList.remove("hidden");
      window.scrollTo({ top:0, behavior:"smooth" });
    }

    function cancelEdit() {
      state.editingCustomId = null;
      $("customName").value = ""; $("customUrl").value = "";
      $("saveCustom").textContent = "＋ 나만의 주소 등록하기";
      $("cancelEdit").classList.add("hidden");
    }

    function render() {
      renderCategories();
      const isCustom = state.category === "기타";
      $("productSection").classList.toggle("hidden", isCustom);
      $("customSection").classList.toggle("hidden", !isCustom);
      $("clearSearch").classList.toggle("show", Boolean(state.query));
      if (isCustom) renderCustomLinks(); else renderProducts();
    }

    function openModal(product) {
      state.selected = product;
      state.tab = "images";
      $("modalCat").textContent = product.category || "제품";
      $("modalTitle").textContent = product.title || "제품 상세";
      $("modalBackdrop").classList.add("open");
      $("modalBackdrop").setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      renderModalTab();
    }

    function closeModal() {
      $("modalBackdrop").classList.remove("open");
      $("modalBackdrop").setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      state.selected = null;
    }

    function setTab(tab) {
      state.tab = tab;
      renderModalTab();
    }

    function renderModalTab() {
      const product = state.selected;
      if (!product) return;
      document.querySelectorAll(".tab").forEach((btn) => btn.classList.toggle("active", btn.dataset.tab === state.tab));
      const body = $("modalBody");
      body.innerHTML = "";
      if (state.tab === "images") renderImageTab(body, product);
      if (state.tab === "detail") renderDetailTab(body, product);
      if (state.tab === "links") renderLinksTab(body, product);
    }

    function renderImageTab(body, product) {
      const top = el("div", "btn-row");
      const all = el("button", "small-btn green", "↓ 전체 이미지 저장");
      all.type = "button";
      all.addEventListener("click", () => downloadAll(product));
      top.appendChild(all);
      body.appendChild(top);
      body.appendChild(el("div", "", ""));
      const grid = el("div", "image-grid");
      (product.images || []).forEach((src, idx) => {
        const tile = el("div", "image-tile");
        tile.appendChild(el("div", "image-badge", idx === 0 ? "메인" : idx === 3 ? "상세/성분" : `이미지 ${idx + 1}`));
        tile.appendChild(makeImage(src, `${product.title} 이미지 ${idx + 1}`, () => openFull(src)));
        const save = el("button", "image-save", "↓");
        save.type = "button";
        save.title = "이미지 저장";
        save.addEventListener("click", (ev) => { ev.stopPropagation(); downloadImage(src, `${product.title}_${idx + 1}.jpg`); });
        tile.appendChild(save);
        grid.appendChild(tile);
      });
      if (!product.images || !product.images.length) grid.appendChild(el("div", "empty", "등록된 이미지가 없습니다."));
      body.appendChild(grid);
    }

    function renderDetailTab(body, product) {
      const overview = el("section", "section-card");
      overview.appendChild(sectionTitle("Product Description", "#4f46e5"));
      overview.appendChild(el("p", "desc", product.content || "제품 설명이 등록되지 않았습니다."));
      body.appendChild(overview);

      const points = el("section", "section-card");
      points.appendChild(sectionTitle("Key Points", "#f59e0b"));
      const plist = el("div", "point-list");
      (product.points && product.points.length ? product.points : ["상세 이미지를 통해 핵심 포인트를 확인해 주세요."]).forEach((txt) => plist.appendChild(el("div", "point", "• " + txt)));
      points.appendChild(plist);
      body.appendChild(points);

      const ing = el("section", "section-card");
      ing.appendChild(sectionTitle("Ingredients / 주요 성분", "#10b981"));
      ing.appendChild(el("p", "desc", product.ingredients || "상세 이미지의 성분표를 통해 전성분을 확인하실 수 있습니다."));
      body.appendChild(ing);

      if (product.usage) {
        const usage = el("section", "section-card");
        usage.appendChild(sectionTitle("How to Use / 섭취·사용 방법", "#4f46e5"));
        usage.appendChild(el("p", "desc", product.usage));
        body.appendChild(usage);
      }

      if (product.recommend && product.recommend.length) {
        const rec = el("section", "section-card");
        rec.appendChild(sectionTitle("Recommended For", "#f59e0b"));
        const list = el("div", "point-list");
        product.recommend.forEach((txt, idx) => list.appendChild(el("div", "point", `${idx + 1}. ${txt}`)));
        rec.appendChild(list);
        body.appendChild(rec);
      }
      body.appendChild(el("p", "notice", "※ 건강기능식품 및 의료기기 관련 표현은 공식 상세페이지, 제품 라벨, 심의 문구를 기준으로 확인해 주세요."));
    }

    function sectionTitle(text, color) {
      const h = el("h3", "section-title");
      h.style.color = color;
      h.appendChild(el("span", "dot"));
      h.appendChild(document.createTextNode(text));
      return h;
    }

    function renderLinksTab(body, product) {
      const url = product.officialUrl || FALLBACK_URL;
      const fixed = el("section", "url-card");
      fixed.appendChild(el("strong", "", "쇼핑몰 상세페이지"));
      fixed.appendChild(el("p", "url-text", url));
      const row = el("div", "btn-row");
      const open = el("a", "small-btn green", "열기");
      open.href = safeUrl(url); open.target = "_blank"; open.rel = "noopener";
      const share = el("button", "small-btn", "공유"); share.type = "button";
      share.addEventListener("click", () => shareLink(product.title, url));
      const copy = el("button", "small-btn", "복사"); copy.type = "button";
      copy.addEventListener("click", () => copyText(url, "상세페이지 주소"));
      [open, share, copy].forEach((node) => row.appendChild(node));
      fixed.appendChild(row);
      body.appendChild(fixed);

      const title = el("p", "notice", "개인 등록 링크 5개 · 현재 기기에만 저장됩니다.");
      body.appendChild(title);
      for (let i = 1; i <= 5; i++) {
        body.appendChild(makePersonalLinkItem(product, i));
      }
    }

    function makePersonalLinkItem(product, index) {
      const key = String(product.id);
      const saved = (state.personalLinks[key] || {})["link" + index] || { name:`링크 ${index}`, url:"" };
      const box = el("div", "link-item");
      const name = document.createElement("input");
      name.className = "field"; name.type = "text"; name.value = saved.name || `링크 ${index}`; name.placeholder = "이름 입력";
      const url = document.createElement("input");
      url.className = "field"; url.type = "url"; url.value = saved.url || ""; url.placeholder = "마케팅 주소(URL)를 입력하세요";
      const row = el("div", "btn-row");
      const save = el("button", "small-btn primary", saved.url ? "변경" : "등록"); save.type = "button";
      save.addEventListener("click", () => {
        if (!url.value.trim()) { toast("주소를 입력해 주세요."); return; }
        if (!state.personalLinks[key]) state.personalLinks[key] = {};
        state.personalLinks[key]["link" + index] = { name:name.value.trim() || `링크 ${index}`, url:url.value.trim() };
        saveStorage(); toast("링크가 저장되었습니다."); renderModalTab();
      });
      row.appendChild(save);
      if (saved.url) {
        const open = el("a", "small-btn green", "열기"); open.href = safeUrl(saved.url); open.target = "_blank"; open.rel = "noopener";
        const copy = el("button", "small-btn", "복사"); copy.type = "button"; copy.addEventListener("click", () => copyText(saved.url, saved.name || "주소"));
        const share = el("button", "small-btn", "공유"); share.type = "button"; share.addEventListener("click", () => shareLink(saved.name, saved.url));
        const del = el("button", "small-btn rose", "삭제"); del.type = "button";
        del.addEventListener("click", () => {
          if (state.personalLinks[key]) delete state.personalLinks[key]["link" + index];
          saveStorage(); toast("링크가 삭제되었습니다."); renderModalTab();
        });
        [open, copy, share, del].forEach((node) => row.appendChild(node));
      }
      box.appendChild(name); box.appendChild(url); box.appendChild(row);
      return box;
    }

    function openFull(src) {
      if (!src) return;
      $("fullImage").src = src;
      $("fullscreen").classList.add("open");
      $("fullscreen").setAttribute("aria-hidden", "false");
    }

    function closeFull() {
      $("fullscreen").classList.remove("open");
      $("fullscreen").setAttribute("aria-hidden", "true");
      $("fullImage").removeAttribute("src");
    }

    function bindEvents() {
      $("searchInput").addEventListener("input", (e) => { state.query = e.target.value; render(); });
      $("clearSearch").addEventListener("click", () => { state.query = ""; $("searchInput").value = ""; render(); });
      $("sortSelect").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
      $("shareSite").addEventListener("click", () => shareLink("지쿱 공식 쇼핑몰", SHOP_URL));
      $("closeModal").addEventListener("click", closeModal);
      $("modalBackdrop").addEventListener("click", (e) => { if (e.target === $("modalBackdrop")) closeModal(); });
      document.querySelectorAll(".tab").forEach((btn) => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
      $("saveCustom").addEventListener("click", saveCustom);
      $("cancelEdit").addEventListener("click", cancelEdit);
      $("closeFull").addEventListener("click", closeFull);
      $("fullscreen").addEventListener("click", (e) => { if (e.target === $("fullscreen")) closeFull(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeFull(); closeModal(); } });
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadStorage(); bindEvents(); render();
      console.log("GCOOP promptbook loaded:", PRODUCTS.length, "products");
    });
  </script>
</body>
</html>
